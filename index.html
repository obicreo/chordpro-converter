<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta
    name="description"
    content="Convert aligned chord and lyric text to ChordPro, or convert ChordPro back to a standard chord sheet."
  >
  <title>ChordPro Converter</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="page-header">
      <h1>ChordPro Converter</h1>
      <p class="intro">
        Convert aligned chord sheets to ChordPro and convert ChordPro back to
        standard chord-over-lyrics text while preserving chord positions.
      </p>
    </header>

    <section class="toolbar" aria-label="Converter settings">
      <label>
        Input format
        <select id="inputFormat">
          <option value="text">Standard text</option>
          <option value="chordpro">ChordPro</option>
        </select>
      </label>

      <label>
        Output format
        <select id="outputFormat">
          <option value="chordpro">ChordPro</option>
          <option value="text">Standard text</option>
        </select>
      </label>

      <label>
        Text font
        <select id="font">
          <option value="SFMono-Regular">SF Mono</option>
          <option value="Menlo">Menlo</option>
          <option value="Consolas">Consolas</option>
          <option value="Liberation Mono">Liberation Mono</option>
          <option value="Courier New">Courier New</option>
          <option value="Arial">Arial</option>
          <option value="Segoe UI">Segoe UI</option>
          <option value="Roboto">Roboto</option>
          <option value="Open Sans">Open Sans</option>
          <option value="Georgia">Georgia</option>
          <option value="Times New Roman">Times New Roman</option>
        </select>
      </label>

      <label>
        Font size
        <input id="fontSize" type="number" min="8" max="72" value="16">
      </label>

      <label>
        Mapping
        <select id="mapping">
          <option value="nearest">Nearest character</option>
          <option value="before">Previous character</option>
          <option value="after">Next character</option>
        </select>
      </label>

      <button id="swap" type="button">Swap formats</button>
      <button id="clear" type="button">Clear</button>
    </section>

    <section class="grid">
      <article class="card">
        <div class="card-header">
          <strong id="sourceTitle">Standard text input</strong>
          <span class="hint">Updates automatically while you type</span>
        </div>

        <textarea
          id="source"
          spellcheck="false"
          wrap="off"
          aria-label="Converter input"
          placeholder="Paste content here..."
        ></textarea>
      </article>

      <article class="card">
        <div class="card-header">
          <strong id="outputTitle">ChordPro output</strong>

          <div class="output-actions">
            <button id="copy" type="button">Copy</button>
            <button id="download" type="button">Download</button>
          </div>
        </div>

        <textarea
          id="output"
          readonly
          spellcheck="false"
          wrap="off"
          aria-label="Converted output"
        ></textarea>
      </article>
    </section>

    <div class="status-row">
      <div id="status" class="status" role="status" aria-live="polite"></div>

      <a
        class="repo-link"
        href="https://github.com/obicreo/chordpro-converter"
        target="_blank"
        rel="noopener noreferrer"
      >
        View on GitHub
      </a>
    </div>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
